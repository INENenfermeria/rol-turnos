    header{position:sticky; top:0; background:rgba(11,18,32,.95); backdrop-filter: blur(10px); border-bottom:1px solid var(--line); padding:14px;}
    h1{font-size:16px; margin:0 0 10px;}
    .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    select{background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px; font-size:14px;}
    main{padding:14px; max-width:820px; margin:0 auto;}
    .meta{color:var(--muted); font-size:13px;}
    .area-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:10px;}
    .area-head{display:flex; align-items:center; justify-content:space-between; gap:10px;}
    .badge{display:inline-flex; align-items:center; gap:10px; border-radius:999px; padding:8px 12px; font-weight:800; font-size:13px;}
    .hint{margin-top:10px; color:var(--muted); font-size:13px; border:1px dashed var(--line); padding:10px; border-radius:12px;}
  </style>
</head>

<header>
  <h1>Rol de Turnos – Enero 2026</h1>

</header>

function pad2(n){ return String(n).padStart(2, "0"); }
function toISODate(d){
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function fmtPretty(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("es-PE", { weekday:"long", day:"2-digit", month:"long", year:"numeric" });
}

/** ====== 31 DÍAS + SELECCIÓN AUTOMÁTICA ====== */
function buildJanuaryOptions(){
  daySelect.innerHTML = "";
  for(let day=1; day<=31; day++){
    const d = new Date(YEAR, MONTH, day);
    const iso = toISODate(d);
    const opt = document.createElement("option");
    opt.value = iso;
    opt.textContent = `${pad2(day)}/01/${YEAR}`;
    daySelect.appendChild(opt);
  }

  const today = new Date();
  const sameJan = today.getFullYear()===YEAR && today.getMonth()===MONTH;

  if (sameJan) {
    const todayISO = toISODate(today);
    daySelect.value = todayISO;
  } else {
    daySelect.value = `${YEAR}-01-01`;
  }
}

const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modal-title");
const modalContent = document.getElementById("modal-content");

document.addEventListener("click", (e) => {
  if (e.target.id === "modal-close") {
    closeModal();
  }
  if (e.target === modal) {
    closeModal();
  }
});


function openChecklist(area){
  // Si el área tiene dos roles, mostramos ambos. Si solo tiene uno, mostramos ese.
  const entry = CHECKLISTS[area];
  modalTitle.textContent = area;

  if (!entry){
    modalContent.innerHTML = "<b>No hay checklist definido para esta área.</b>";
  } else {
    const lic = entry["Licenciados"];
    const tec = entry["Técnicos"];

    if (lic && tec){
      modalContent.innerHTML = `
        <div style="padding:10px; border:1px dashed #24314e; border-radius:12px; margin-bottom:10px;">
          <b>Licenciados</b><br><br>${lic}
        </div>
        <div style="padding:10px; border:1px dashed #24314e; border-radius:12px;">
          <b>Técnicos</b><br><br>${tec}
        </div>
      `;
    } else if (lic){
      modalContent.innerHTML = lic;
    } else if (tec){
      modalContent.innerHTML = tec;
    } else {
      modalContent.innerHTML = "<b>No hay checklist definido.</b>";
    }
  }

  modal.style.display = "block";
}

function closeModal(){
  modal.style.display = "none";
}


modal.addEventListener("click", (e)=>{ if(e.target === modal) closeModal(); });




/** ====== RENDER ====== */
function render(){
  const iso = daySelect.value;
  pretty.textContent = "• " + fmtPretty(iso);

  const dayData = DATA[iso] || {};
  content.innerHTML = "";

  AREAS_ORDER.forEach(area=>{
    // ✅ si el área NO existe en la data del día, NO se muestra
    const areaData = dayData[area];
    if (!areaData) return;

    // ✅ si existe pero no tiene lic ni tec, NO se muestra
    const hasLic = areaData?.lic?.length;
    const hasTec = areaData?.tec?.length;
    if (!hasLic && !hasTec) return;

    const cfg = AREAS[area];

    // Card
    const card = document.createElement("div");
    card.className = "area-card";

    // Header
    const head = document.createElement("div");
    head.className = "area-head";

    // Badge (abre checklist excepto Guardia nocturna)
    const badge = document.createElement("div");
    badge.className = "badge";
    badge.style.background = cfg.color;
    badge.style.color = cfg.text;
    badge.textContent = (area === "Código Rojo" ? "⚠️ " : "") + area;

    const noChecklist = (area === "Guardia nocturna");
    badge.style.cursor = noChecklist ? "default" : "pointer";
    badge.onclick = () => {
      if (noChecklist) return;
      openChecklist(area);
    };

    head.appendChild(badge);
    card.appendChild(head);

    // Contenedor de lista
    const list = document.createElement("div");
    list.className = "hint";
    list.style.borderStyle = "solid";
    list.style.borderColor = "rgba(36,49,78,.6)";

    // helper para imprimir filas
function addPerson(tipo, p){
  const row = document.createElement("div");
  row.style.padding = "8px 0";
  row.style.borderBottom = "1px dashed rgba(36,49,78,.6)";

  const rolTxt = (tipo === "lic") ? "Lic." : "Tec.";

  // ⬇️ horario opcional
  const horario = p.horario || "";
  const horarioHTML = horario
    ? `<div style="color:#a9b8d6; font-size:13px;">${rolTxt} · ${horario}</div>`
    : "";

  row.innerHTML = `
    <div style="font-weight:800;">${p.nombre}</div>
    ${horarioHTML}
  `;

  list.appendChild(row);
}


     // Licenciados primero
    (areaData.lic || []).forEach(p => addPerson("lic", p));
    // Técnicos después
    (areaData.tec || []).forEach(p => addPerson("tec", p));

    // quitar la línea final del último
    const last = list.lastElementChild;
    if (last) last.style.borderBottom = "none";

    card.appendChild(list);
    content.appendChild(card);
  });
}
